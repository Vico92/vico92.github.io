<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Second</title>
  <style>
    :root { --bg: #fbfaf7; --text: #1f1f1d; --muted: #5f5e59; --accent: #7a4a1e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161614; --text: #ecebe5; --muted: #a8a69d; --accent: #d9a66a; } }
    body { margin: 0; padding: 48px 16px; background: var(--bg); color: var(--text);
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 17px; line-height: 1.55; }
    main { max-width: 36rem; margin: 0 auto; }
    h1 { font-size: 1.8rem; margin: 0 0 8px; }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>Second</h1>
  <p>Un coach de jeux de plateau dans tes lunettes Meta Ray-Ban Display : échecs, dames, Othello, 4 en ligne, contre les robots.</p>
  <p class="muted">En bêta privée. Rien n'est vendu pour l'instant.</p>
  <p><a href="privacy/">Politique de confidentialité</a></p>
</main>
</body>
</html>
